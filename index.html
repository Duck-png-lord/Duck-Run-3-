<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Run 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Menu Screen -->
    <div id="menu-screen" class="screen active">
        <h1>DUCK RUN 3</h1>
        <div class="difficulty-selector">
            <h3>Difficulty:</h3>
            <div class="difficulty-buttons">
                <button class="difficulty-btn active" data-difficulty="1">Easy</button>
                <button class="difficulty-btn" data-difficulty="2">Medium</button>
                <button class="difficulty-btn" data-difficulty="3">Hard</button>
            </div>
        </div>
        <div class="map-selector">
            <h3>Map:</h3>
            <div class="map-buttons">
                <button class="map-btn active" data-map="1">Forest</button>
                <button class="map-btn" data-map="2">Desert</button>
                <button class="map-btn" data-map="3">Cyber</button>
                <button class="map-btn" data-map="4">Space</button>
            </div>
        </div>
        <button id="start-btn" class="menu-btn">START GAME</button>
        <button id="fix-wifi-btn" class="menu-btn">FIX MY WIFI</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <canvas id="game-canvas" width="800" height="500"></canvas>
        <div class="score-display">
            <span id="score">Score: 0</span>
            <span id="high-score">High Score: 0</span>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen">
        <h1>GAME OVER</h1>
        <p id="game-over-score">Score: 0</p>
        <p id="game-over-high-score">High Score: 0</p>
        <button id="restart-btn" class="menu-btn">PLAY AGAIN</button>
        <button id="back-to-menu-btn" class="menu-btn">MAIN MENU</button>
    </div>

    <!-- Fix WiFi Screen -->
    <div id="fix-wifi-screen" class="screen">
        <h1>FIX MY WIFI</h1>
        <div id="wifi-fix-content">
            <img id="wifi-fix-image" src="" alt="Jeff" style="display: none; max-width: 200px;">
            <p id="wifi-fix-text"></p>
        </div>
        <div class="wifi-buttons">
            <button id="wifi-yes" class="menu-btn">YES</button>
            <button id="wifi-no" class="menu-btn">NO</button>
        </div>
        <button id="back-to-menu" class="menu-btn">BACK TO MENU</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
